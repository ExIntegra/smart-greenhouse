name: greenhouse-site

volumes:
  prometheus-data:
  grafana-data:

services:
  node_exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m
    memswap_limit: 128m

  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    mem_limit: 128m
    memswap_limit: 256m

  prometheus:
    image: prom/prometheus:v3.13.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 256m
    memswap_limit: 512m

  grafana:
    image: grafana/grafana:13.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://growpanel.ru/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 384m
    memswap_limit: 768m

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on: [grafana]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./web-server/html:/usr/share/nginx/html:ro
    mem_limit: 64m
    memswap_limit: 128m

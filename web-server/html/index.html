<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Умная теплица</title>

    <link rel="stylesheet" href="/style.css?=2">
</head>

<body>

    <header class="header">
        <div class="header-content">
            <div>
                <h1>Умная теплица</h1>
                <p>Панель управления и мониторинга</p>
            </div>
        </div>
    </header>


    <main class="container">

        <!-- ТЕПЛИЦА -->

        <section class="panel">

            <div class="panel-header">
                <div>
                    <h2>Теплица</h2>
                    <p>Пример Видеонаблюдение</p>
                </div>
            </div>


            <div class="greenhouse-media">

                <!-- ВИДЕОНАБЛЮДЕНИЕ -->

                <div class="greenhouse-image">

                    <img
                        src="/greenhouse.jpg"
                        alt="Видеонаблюдение"
                    >

                    <div class="camera-overlay">
                        <span class="camera-icon">●</span>
                        Online
                    </div>

                </div>


                <!-- КАКТУС -->

                <div class="cactus-image">

                    <img
                        src="/cactus.jpg"
                        alt="Кактус"
                    >

                </div>

            </div>

        </section>

	<section class="panel">
		<div class="panel-header">
			<div>
				<h2> Пример уведомления из Telegram</h2>
			</div>
		</div>

		<img class="telegram-image"
		     src="/notification-telegram.jpg"
		     alt="Уведомление из Телеграм">
	</section>

	
        <!-- МОНИТОРИНГ -->

        <section class="panel">

            <div class="panel-header">
                <div>
                    <h2>Мониторинг</h2>
                </div>
            </div>

            <iframe
                src="/grafana/d/adv6z8s/metriki?kiosk"
                class="grafana-frame">
            </iframe>

        </section>
    </main>

    <footer>
        growpanel.ru
    </footer>
</body>
</html>

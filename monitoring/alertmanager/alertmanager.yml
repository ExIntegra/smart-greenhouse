global:
  resolve_timeout: 5m

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'null'

  group_by:
    - instance

  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1m

  routes:
    - matchers:
        - 'severity=warning'
      receiver: 'telegram'

receivers:
  - name: 'null'

  - name: 'telegram'
    telegram_configs:
      - api_url: https://api.telegram.org
        bot_token_file: /run/secrets/telegram_token
        chat_id: -1004342868009
        message_thread_id: 2
        message: '{{ template "telegram" . }}'
        send_resolved: true






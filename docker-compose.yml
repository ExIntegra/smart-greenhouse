---
volumes:
  prometheus-data: {}
  grafana-data: {}
  alertmanager-data: {}

services:
  node_exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: prometheus
    ports:
      - '9090:9090'
    restart: unless-stopped
    volumes:
      - './monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - 'prometheus-data:/prometheus'

  grafana:
    image: grafana/grafana:13.0
    container_name: grafana
    ports:
      - '3000:3000'
    restart: unless-stopped
    volumes:
      - 'grafana-data:/var/lib/grafana'
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

  cadvisor:
    image: ghcr.io/google/cadvisor
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - '8090:8080'
    privileged: true
    volumes:
      - '/:/rootfs:ro'
      - '/var/run:/var/run:ro'
      - '/sys:/sys:ro'
      - '/var/lib/docker:/var/lib/docker:ro'
      - '/dev/disk:/dev/disk:ro'

  nginx:
    container_name: nginx
    image: nginx:stable-alpine3.24-perl
    restart: unless-stopped
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - './web-server/nginx.conf:/etc/nginx/nginx.conf:ro'
      - "./certbot/www:/var/www/certbot:ro"
      - "./certbot/conf:/etc/letsencrypt:ro"

  certbot:
    image: certbot/certbot
    container_name: certbot

    volumes:
      - "./certbot/www:/var/www/certbot"
      - "./certbot/conf:/etc/letsencrypt"

  greenhouse-api:
    build: ./greenhouse-api
    environment:
      API_KEY: ${API_KEY}

  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - '9093:9093'
    volumes:
      - './monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml'
      - 'alertmanager-data:/data'
